name: Gerar APK

on:
  push:
    branches: [main]
    paths: ["p3.txt", ".github/workflows/main.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar projeto e arquivos do app
        run: |
          set -e
          for f in p1.txt p2.txt p3.txt; do test -s "$f" || { echo "FALTA O ARQUIVO $f"; exit 1; }; done
          flutter create --platforms=android --org com.isaque.mangatranslate --project-name manga_translate app
          cd app
          rm -f test/widget_test.dart
          mkdir -p lib/models lib/services lib/screens
          cat ../p1.txt ../p2.txt ../p3.txt > ../gerar.sh
          bash ../gerar.sh
          for f in pubspec.yaml lib/main.dart lib/screens/home_screen.dart lib/screens/review_screen.dart lib/screens/reader_screen.dart; do
            test -s "$f" || { echo "ARQUIVO INCOMPLETO: $f. Cole de novo os arquivos p1, p2 e p3."; exit 1; }
          done
          tail -n 3 lib/screens/reader_screen.dart | grep -q "}" || { echo "reader_screen cortado"; exit 1; }
          M=android/app/src/main/AndroidManifest.xml
          grep -q android.permission.INTERNET "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="MangaTranslate"|' "$M"
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.0")\n    implementation("com.google.mlkit:text-recognition-devanagari:16.0.0")\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.0")\n    implementation("com.google.mlkit:text-recognition-korean:16.0.0")\n}\n' >> android/app/build.gradle.kts
          else
            printf '\ndependencies {\n    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"\n    implementation "com.google.mlkit:text-recognition-devanagari:16.0.0"\n    implementation "com.google.mlkit:text-recognition-japanese:16.0.0"\n    implementation "com.google.mlkit:text-recognition-korean:16.0.0"\n}\n' >> android/app/build.gradle
          fi
      - name: Compilar APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink
          mv build/app/outputs/flutter-apk/app-release.apk MangaTranslate.apk
      - name: Publicar para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MangaTranslate (versão ${{ github.run_number }})
          files: app/MangaTranslate.apk
